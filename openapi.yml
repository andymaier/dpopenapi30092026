openapi: '3.0.3'
info:
  title: Katalog API
  description: API zur Verwaltung des Artikelkatalogs.
  version: '1.0.0'
  x-api-id: 0b6c2c1e-8f4a-4d7e-9a3b-5c1d2e3f4a5b
  x-audience: company-internal
  contact:
    name: Katalog API Team
    url: https://api.dev.dp.com
    email: katalog-api@dp.com
servers:
  - url: localhost:50001
  - url: api.dev.dp.com
  - url: api.prod.dp.com
tags:
  - name: Shop
  - name: Customer
paths:
  /articles:
    get:
      tags:
        - Shop
      summary: Dieser Endpunkt gibt alle Artikel zurück
      description: Alle Artikel werden zurückgegeben.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtikelResponseObject'
        default:
          $ref: '#/components/responses/DefaultError'
    post:
      tags:
        - Shop
      summary: Lege einen neuen Artikel an
      description: Ein neuer Artikel wird angelegt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtikelRequestObject'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URI des neuen Artikels
              example: https://localhost:50001/articles/12
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtikelResponseObject'      
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/DefaultError'
  /articles/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          maxLength: 36
        required: true
    get:
      tags:
        - Shop
      summary: Dieser Endpunkt gibt einen Artikel zurück
      description: Ein Artikel werden zurückgegeben.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtikelResponseObject'
        default:
          $ref: '#/components/responses/DefaultError'

    put:
      tags:
        - Shop
      summary: Dieser Endpunkt ändert einen Artikel
      description: Ein Artikel wird geändert
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtikelRequestObject'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:                
                $ref: '#/components/schemas/ArtikelResponseObject'
        default:
          $ref: '#/components/responses/DefaultError'
    
    patch:
      tags:
        - Shop
      summary: Dieser Endpunkt ändert den Wert eines oder mehrerer Felder Artikel
      description: Artikelfelder werden geändert
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtikelPatchRequestObject'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:                
                $ref: '#/components/schemas/ArtikelResponseObject'
        default:
          $ref: '#/components/responses/DefaultError'

    delete:
      tags:
        - Shop
      summary: Dieser Endpunkt löscht einen Artikel zurück
      description: Ein Artikel wird gelöscht.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtikelResponseObject'
        default:
          $ref: '#/components/responses/DefaultError'


components:
  responses:
    DefaultError:
      description: Unerwarteter Fehler
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ArtikelId:
      type: string
      format: uuid
      maxLength: 36
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: Dies ist die Artikelid für die eindeutige Identifizierung
    ArtikelBase:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ArtikelId'
        name:
          type: string
          maxLength: 100
          example: Kirschen
          description: Das ist der Name des Artikels.
        preis:
          type: number
          format: float
          minimum: 0
          example: 0.99
          description: Das ist der Preis des Artikels.
    ArtikelRequestObject:
      type: object
      allOf:
        - $ref: '#/components/schemas/ArtikelBase'
        - type: object
          required:
            - name
            - preis
    ArtikelResponseObject:
      type: object
      allOf:
        - $ref: '#/components/schemas/ArtikelBase'
        - type: object
          required:
            - id
            - name
            - preis
    ArtikelPatchRequestObject:
      $ref: '#/components/schemas/ArtikelBase'
    Problem:
      type: object
      description: Fehlerobjekt nach RFC 7807 (Problem Details for HTTP APIs)
      properties:
        type:
          type: string
          format: uri
          example: https://api.dev.dp.com/problems/validation-error
          description: URI, die den Fehlertyp identifiziert
        title:
          type: string
          example: Validierungsfehler
          description: Kurze, lesbare Zusammenfassung des Fehlertyps
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          example: 400
          description: HTTP-Statuscode
        detail:
          type: string
          example: Fehler weil...
          description: Fehlernachricht
        instance:
          type: string
          format: uri
          example: https://api.dev.dp.com/articles/3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: URI der konkreten Fehlerinstanz
